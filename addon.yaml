# CrowdSec integration: one entry per CrowdSec install, reached through a Servers (SSH) entry.
# Shows what it blocks (bans, web-firewall blocks), the bouncer that enforces them, and whether it's
# still reading logs, so protection can't silently stop again (it had, until 2026-10-19).
name: crowdsec
kind: integration
title: CrowdSec
description: Bot and attack blocking in front of your sites, and proof it's still working.
version: 0.2.1
you_need:
  - "CrowdSec running in Docker on a server you have"
  - "That server set up in the Servers (SSH) add-on"
provider: provider.py
entry_label: CrowdSec install
requires:
  addons: [server]
entry_schema:
  server: str              # the Servers (SSH) entry it runs on
  container: "str?"        # docker container name, default crowdsec
  note: "str?"
entry_form:
  server: "Server (its name on the Servers (SSH) page, e.g. web1)"
  container: "Container name (empty = crowdsec)"
  note: "Note"

help:
  server:
    label: Server
    say: "The name you gave this server on the Servers (SSH) page. Any server Hisho can reach over SSH counts, at home or on the internet. Add it there first; then this page lists the CrowdSec installs it finds on your servers, and Use this fills this in."
  container:
    label: Container name
    say: "The name of the Docker container CrowdSec runs in. Leave it empty if it is called crowdsec. Use this fills it in for an install Hisho found; otherwise docker ps on the server lists the names."
    get: "https://docs.docker.com/reference/cli/docker/container/ls/"
    get_label: How to list containers
  note:
    say: "Anything that helps you remember this install, like which sites it protects."

# Found: CrowdSec is looked for on the servers Hisho already knows (Servers (SSH): at home or a VPS), never by
# scanning the network
find:
  title: "On the servers Hisho knows"
  empty: "No CrowdSec found on the servers Hisho knows. Add the server it runs on first (at home or on the internet, any server you reach over SSH), then look again."
  link: {label: "Open Servers (SSH)", href: "#/addons/server"}
